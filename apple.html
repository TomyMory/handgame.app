<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Crush AR - Hard Mode</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body { margin: 0; background-color: #222; color: white; font-family: sans-serif; text-align: center; }
        
        #game-container { 
            position: relative; 
            width: 95vw;          
            max-width: 960px;     
            aspect-ratio: 4 / 3;  
            margin: 20px auto; 
            border: 4px solid #fff; 
            border-radius: 10px; 
            background-color: #000; 
            overflow: hidden; 
        }
        
        /* 全画面表示の時のスタイル（標準API用） */
        #game-container:fullscreen { max-width: 100%; border: none; border-radius: 0; background-color: #000; }
        #game-container:-webkit-full-screen { max-width: 100%; border: none; border-radius: 0; background-color: #000; }
        
        /* iPhoneのSafariなど、標準APIが使えない端末用の疑似全画面スタイル */
        .ios-fullscreen {
            position: fixed !important; top: 0 !important; left: 0 !important;
            width: 100vw !important; height: 100vh !important;
            max-width: none !important; margin: 0 !important;
            border: none !important; border-radius: 0 !important;
            z-index: 9999 !important; background-color: #000 !important;
        }

        video { display: none; }
        
        /* object-fit: contain; を追加し、全画面時も映像が歪まないようにする */
        canvas { 
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; 
            object-fit: contain; 
            transform: scaleX(-1); 
        }
        
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20; }
        #ui-layer { position: absolute; top: 10px; left: 10px; right: 10px; display: none; justify-content: space-between; font-size: 24px; font-weight: bold; z-index: 10; text-shadow: 2px 2px 4px rgba(0,0,0,1); }
        #reload-warning { position: absolute; top: 50px; width: 100%; text-align: center; color: #ffeb3b; font-size: 24px; font-weight: bold; display: none; z-index: 10; text-shadow: 2px 2px 4px #000; }
        
        /* ★ 全画面切り替えボタンのスタイル ★ */
        #fullscreen-btn {
            position: absolute; bottom: 10px; right: 10px;
            padding: 8px 12px; font-size: 16px; font-weight: bold;
            background-color: rgba(0, 0, 0, 0.6); color: white;
            border: 2px solid white; border-radius: 5px;
            cursor: pointer; z-index: 30; transition: 0.2s;
        }
        #fullscreen-btn:hover { background-color: rgba(255, 255, 255, 0.3); }

        button.action { padding: 15px 30px; font-size: 20px; cursor: pointer; background-color: #4CAF50; color: white; border: none; border-radius: 5px; margin-top: 20px; transition: 0.2s; }
        button.action:hover { background-color: #45a049; }
        .step-text { font-size: 1.2rem; margin-bottom: 10px; padding: 0 20px; line-height: 1.5; }
    </style>
</head>
<body>

    <h1>🍎 Apple Crush AR (Hard Mode) 🍎</h1>
    <p>リンゴ(🍎)をグーで潰せ！ いがぐりを潰すと減点。1回潰したら「パー」でリロード！</p>

    <div id="game-container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="game-canvas" width="640" height="480"></canvas>
        
        <div id="ui-layer">
            <div>Score: <span id="score">0</span></div>
            <div>Time: <span id="time">30</span>s</div>
        </div>
        <div id="reload-warning">✋ パーにしてリロード！ ✋</div>

        <!-- ★ 全画面切り替えボタン ★ -->
        <button id="fullscreen-btn">🔲 全画面にする</button>

        <div id="overlay-screen" class="overlay">
            <h2 id="overlay-title">AIモデルを読み込み中...</h2>
            <p id="overlay-desc" class="step-text">カメラを許可し、少しお待ちください。</p>
            <button id="action-btn" class="action" style="display: none;">次へ</button>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('game-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const overlayScreen = document.getElementById('overlay-screen');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');
        const actionBtn = document.getElementById('action-btn');
        const uiLayer = document.getElementById('ui-layer');
        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        const reloadWarning = document.getElementById('reload-warning');
        
        // ★ 全画面機能の要素を取得 ★
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const gameContainer = document.getElementById('game-container');

        let gameState = 'loading'; 
        let score = 0;
        let timeLeft = 30;
        let items = [];
        let gameTimer = null;

        let currentHandRatio = 0; 
        let openHandRatio = 0;
        let closedHandRatio = 0;
        let handPos = { x: 0, y: 0 };
        let isHandClosed = false;
        let canCrush = true;
        let wasHandClosedLastFrame = false;
        let isCSSFullscreen = false; // iOS用擬似フルスクリーンのフラグ

        // --- ★ 全画面切り替えの処理 ★ ---
        function updateFullscreenUI(isFullscreen) {
            if (isFullscreen) {
                fullscreenBtn.innerText = "✖ 元に戻す";
            } else {
                fullscreenBtn.innerText = "🔲 全画面にする";
            }
        }

        fullscreenBtn.addEventListener('click', () => {
            const isNativeFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
            
            if (isNativeFullscreen || isCSSFullscreen) {
                // フルスクリーンを解除する
                if (isNativeFullscreen) {
                    if (document.exitFullscreen) document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                } else {
                    gameContainer.classList.remove('ios-fullscreen');
                    isCSSFullscreen = false;
                    updateFullscreenUI(false);
                }
            } else {
                // フルスクリーンにする
                if (gameContainer.requestFullscreen) {
                    gameContainer.requestFullscreen().catch(() => {
                        // エラー時（iOS等）はCSSで全画面化
                        gameContainer.classList.add('ios-fullscreen');
                        isCSSFullscreen = true;
                        updateFullscreenUI(true);
                    });
                } else if (gameContainer.webkitRequestFullscreen) {
                    gameContainer.webkitRequestFullscreen();
                } else {
                    // 標準APIがない端末（iPhone等）はCSSで全画面化
                    gameContainer.classList.add('ios-fullscreen');
                    isCSSFullscreen = true;
                    updateFullscreenUI(true);
                }
            }
        });

        // 端末のEscキー等で画面が戻った時のUI同期
        document.addEventListener('fullscreenchange', () => updateFullscreenUI(!!document.fullscreenElement));
        document.addEventListener('webkitfullscreenchange', () => updateFullscreenUI(!!document.webkitFullscreenElement));

        // --- ハンドトラッキングの処理 ---
        function calculateHandRatio(landmarks) {
            const wrist = landmarks[0];
            const middleBase = landmarks[9];
            const palmDist = Math.hypot(wrist.x - middleBase.x, wrist.y - middleBase.y);
            const tips = [8, 12, 16, 20];
            let tipSum = 0;
            tips.forEach(tip => {
                tipSum += Math.hypot(wrist.x - landmarks[tip].x, wrist.y - landmarks[tip].y);
            });
            const avgTipDist = tipSum / tips.length;
            return avgTipDist / palmDist;
        }

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                currentHandRatio = calculateHandRatio(landmarks);
                handPos.x = landmarks[9].x * canvasElement.width;
                handPos.y = landmarks[9].y * canvasElement.height;

                if (gameState === 'playing') {
                    const threshold = closedHandRatio + (openHandRatio - closedHandRatio) * 0.4;
                    isHandClosed = currentHandRatio < threshold;

                    if (!isHandClosed) {
                        canCrush = true;
                        reloadWarning.style.display = 'none';
                    }

                    let skeletonColor = "#00FF00";
                    if (isHandClosed && canCrush) skeletonColor = "#FF0000";
                    if (isHandClosed && !canCrush) skeletonColor = "#FFFF00";

                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: skeletonColor, lineWidth: 5});
                    drawLandmarks(canvasCtx, landmarks, {color: skeletonColor, lineWidth: 2, radius: 3});

                    canvasCtx.beginPath();
                    canvasCtx.arc(handPos.x, handPos.y, 40, 0, 2 * Math.PI);
                    canvasCtx.fillStyle = isHandClosed ? "rgba(255, 0, 0, 0.4)" : "rgba(0, 255, 0, 0.4)";
                    canvasCtx.fill();

                    if (isHandClosed && !wasHandClosedLastFrame && canCrush) {
                        checkCrush();
                        canCrush = false;
                    } else if (isHandClosed && !canCrush) {
                        reloadWarning.style.display = 'block';
                    }
                    wasHandClosedLastFrame = isHandClosed;
                } else {
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: "#00a8ff", lineWidth: 5});
                    drawLandmarks(canvasCtx, landmarks, {color: "#00a8ff", lineWidth: 2});
                }
            } else {
                wasHandClosedLastFrame = false;
            }

            if (gameState === 'playing') {
                updateAndDrawItems();
            }
            canvasCtx.restore();
        }

        function checkCrush() {
            items.forEach(item => {
                if (item.state === 'falling') {
                    const dist = Math.hypot(item.x - handPos.x, item.y - handPos.y);
                    if (dist < 60) {
                        item.state = 'crushed';
                        if (item.type === 'apple') {
                            score++;
                        } else if (item.type === 'chestnut') {
                            score--;
                        }
                        scoreEl.innerText = score;
                    }
                }
            });
        }

        function spawnItem() {
            if (gameState !== 'playing') return;
            const isChestnut = Math.random() < 0.2;
            const speed = Math.random() * 5 + 2; 

            items.push({
                x: Math.random() * (canvasElement.width - 100) + 50,
                y: -40,
                speed: speed,
                type: isChestnut ? 'chestnut' : 'apple',
                state: 'falling',
                rotation: 0 
            });
            setTimeout(spawnItem, Math.random() * 700 + 400);
        }

        function updateAndDrawItems() {
            for (let i = items.length - 1; i >= 0; i--) {
                let p = items[i];
                
                canvasCtx.globalAlpha = 1.0;
                canvasCtx.fillStyle = "#FFFFFF";
                
                if (p.state === 'falling') {
                    p.y += p.speed;
                    p.rotation += 0.05; 
                    
                    if (p.type === 'apple') {
                        canvasCtx.font = "50px sans-serif";
                        canvasCtx.fillText("🍎", p.x - 25, p.y + 15);
                    } else if (p.type === 'chestnut') {
                        canvasCtx.save();
                        canvasCtx.translate(p.x, p.y);
                        canvasCtx.rotate(p.rotation);
                        
                        canvasCtx.fillStyle = "#556b2f";
                        canvasCtx.beginPath();
                        const spikes = 12; 
                        for(let j = 0; j < spikes * 2; j++) {
                            let r = j % 2 === 0 ? 35 : 20; 
                            let a = (j / (spikes * 2)) * Math.PI * 2;
                            canvasCtx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
                        }
                        canvasCtx.closePath();
                        canvasCtx.fill();
                        
                        canvasCtx.strokeStyle = "#3e4f22";
                        canvasCtx.lineWidth = 2;
                        canvasCtx.stroke();
                        canvasCtx.restore();

                        canvasCtx.fillStyle = "#FFFFFF";
                        canvasCtx.font = "30px sans-serif";
                        canvasCtx.fillText("🌰", p.x - 15, p.y + 10);
                    }

                    if (p.y > canvasElement.height + 50) items.splice(i, 1);
                    
                } else if (p.state === 'crushed') {
                    p.alpha = (p.alpha || 1) - 0.1;
                    canvasCtx.globalAlpha = Math.max(0, p.alpha);
                    
                    if (p.type === 'apple') {
                        canvasCtx.font = "50px sans-serif";
                        canvasCtx.fillText("💥", p.x - 25, p.y + 15);
                    } else {
                        canvasCtx.fillStyle = "#FF0000";
                        canvasCtx.font = "bold 30px sans-serif";
                        canvasCtx.fillText("痛っ!!", p.x - 30, p.y + 10);
                    }

                    if (p.alpha <= 0) items.splice(i, 1);
                }
                
                canvasCtx.globalAlpha = 1.0;
            }
        }

        actionBtn.addEventListener('click', () => {
            if (gameState === 'loading_done') {
                gameState = 'calib_open';
                overlayTitle.innerText = "ステップ 1/2";
                overlayDesc.innerHTML = "カメラに手を開いて（パー）向け、<br>画面に青い線（骨格）が出たらボタンを押してください。";
                actionBtn.innerText = "パーの状態で記録";
            } else if (gameState === 'calib_open') {
                if (currentHandRatio === 0) { alert("手が認識されていません。カメラに手を向けてください。"); return; }
                openHandRatio = currentHandRatio;
                gameState = 'calib_close';
                overlayTitle.innerText = "ステップ 2/2";
                overlayDesc.innerHTML = "次に、手をギュッと握り（グー）、<br>その状態でボタンを押してください。";
                actionBtn.innerText = "グーの状態で記録";
            } else if (gameState === 'calib_close') {
                if (currentHandRatio === 0) { alert("手が認識されていません。カメラに手を向けてください。"); return; }
                closedHandRatio = currentHandRatio;
                if (openHandRatio <= closedHandRatio) {
                    alert("うまく認識できませんでした。もう一度パーからやり直してください。");
                    gameState = 'loading_done';
                    overlayTitle.innerText = "やり直し";
                    overlayDesc.innerText = "もう一度手の大きさをAIに学習させます。";
                    actionBtn.innerText = "次へ";
                    return;
                }
                gameState = 'ready';
                overlayTitle.innerText = "準備完了！";
                overlayDesc.innerText = "リンゴは潰し、いがぐりは避けろ！ 1回潰したら「パー」でリロードだ！";
                actionBtn.innerText = "ゲームスタート";
            } else if (gameState === 'ready' || gameState === 'end') {
                startGame();
            }
        });

        function startGame() {
            gameState = 'playing';
            overlayScreen.style.display = 'none';
            uiLayer.style.display = 'flex';
            score = 0;
            timeLeft = 30;
            items = [];
            canCrush = true;
            wasHandClosedLastFrame = false;
            reloadWarning.style.display = 'none';
            scoreEl.innerText = score;
            timeEl.innerText = timeLeft;
            spawnItem();

            gameTimer = setInterval(() => {
                timeLeft--;
                timeEl.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(gameTimer);
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            gameState = 'end';
            uiLayer.style.display = 'none';
            reloadWarning.style.display = 'none';
            overlayScreen.style.display = 'flex';
            overlayTitle.innerText = "タイムアップ！";
            overlayDesc.innerText = `あなたのスコア: ${score}点`;
            actionBtn.innerText = "もう一度遊ぶ";
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 640, height: 480
        });

        camera.start().then(() => {
            gameState = 'loading_done';
            overlayTitle.innerText = "カメラの接続に成功しました";
            overlayDesc.innerText = "まずは、あなたの手の「パー」と「グー」を学習させます。";
            actionBtn.style.display = 'block';
        }).catch(err => { alert("カメラの起動に失敗しました。権限を確認してください。"); });

    </script>
</body>
</html>
