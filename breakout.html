<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Block Breaker</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body { margin: 0; background-color: #222; color: white; font-family: sans-serif; text-align: center; }
        
        #game-container { 
            position: relative; width: 95vw; max-width: 960px; aspect-ratio: 4 / 3; 
            margin: 20px auto; border: 4px solid #fff; border-radius: 10px; 
            background-color: #111; overflow: hidden; 
        }
        
        #game-container:fullscreen { max-width: 100%; border: none; border-radius: 0; }
        #game-container:-webkit-full-screen { max-width: 100%; border: none; border-radius: 0; }
        .ios-fullscreen {
            position: fixed !important; top: 0 !important; left: 0 !important;
            width: 100vw !important; height: 100vh !important; max-width: none !important; margin: 0 !important;
            border: none !important; border-radius: 0 !important; z-index: 9999 !important; background-color: #111 !important;
        }

        video { display: none; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; transform: scaleX(-1); }
        
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20; transition: background 0.3s; }
        #ui-layer { position: absolute; top: 10px; left: 10px; right: 10px; display: none; justify-content: space-between; font-size: 24px; font-weight: bold; z-index: 10; text-shadow: 2px 2px 4px rgba(0,0,0,1); pointer-events: none; }
        
        #warning-text { position: absolute; top: 40%; width: 100%; text-align: center; color: #ff3b3b; font-size: 28px; font-weight: bold; display: none; z-index: 15; text-shadow: 2px 2px 4px #000; pointer-events: none; }
        
        #fullscreen-btn { position: absolute; bottom: 10px; right: 10px; padding: 8px 12px; font-size: 16px; font-weight: bold; background-color: rgba(0, 0, 0, 0.6); color: white; border: 2px solid white; border-radius: 5px; cursor: pointer; z-index: 30; transition: 0.2s; }
        #fullscreen-btn:hover { background-color: rgba(255, 255, 255, 0.3); }

        .btn-group { display: flex; gap: 20px; margin-top: 30px; }
        button.action { padding: 15px 30px; font-size: 20px; cursor: pointer; background-color: #3498db; color: white; border: none; border-radius: 5px; transition: 0.2s; margin-top: 15px;}
        button.action:hover { background-color: #2980b9; }
        button.action:disabled { background-color: #7f8c8d; cursor: not-allowed; }
        
        .mode-desc { font-size: 1rem; color: #ccc; margin-top: 10px; }
        .step-text { font-size: 1.2rem; margin-bottom: 10px; padding: 0 20px; line-height: 1.5; text-shadow: 2px 2px 4px #000; }
    </style>
</head>
<body>

    <h1>🧱 AR Block Breaker 🧱</h1>
    <p>人差し指でボールを打ち返せ！ 下半分でしか打てないぞ！</p>

    <div id="game-container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="game-canvas" width="800" height="600"></canvas>
        
        <div id="ui-layer">
            <div>Score: <span id="score">0</span></div>
            <div id="info-center"></div>
            <div><span id="right-info"></span></div>
        </div>
        
        <div id="warning-text"></div>
        <button id="fullscreen-btn">🔲 全画面にする</button>

        <div id="overlay-screen" class="overlay">
            <h2 id="overlay-title">AIモデルを読み込み中...</h2>
            <p id="overlay-desc" class="step-text">カメラを許可し、お待ちください。</p>
            
            <div id="mode-selection" class="btn-group" style="display: none;">
                <div>
                    <button class="action" onclick="startCalibration('basic')">① ベーシック</button>
                    <div class="mode-desc">ブロック全消しを目指せ！<br>残機3 / タイムボーナスあり</div>
                </div>
                <div>
                    <button class="action" style="background-color: #e67e22;" onclick="startCalibration('timeattack')">② タイムアタック</button>
                    <div class="mode-desc">45秒間ひたすら打ち返せ！<br>落とすと -500点</div>
                </div>
            </div>
            
            <button id="action-btn" class="action" style="display: none;">ゲームスタート</button>
            <button id="retry-btn" class="action" style="display: none;" onclick="showModeSelection()">モード選択へ戻る</button>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('game-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const overlayScreen = document.getElementById('overlay-screen');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');
        const modeSelection = document.getElementById('mode-selection');
        const actionBtn = document.getElementById('action-btn');
        const retryBtn = document.getElementById('retry-btn');
        const uiLayer = document.getElementById('ui-layer');
        const warningText = document.getElementById('warning-text');
        const scoreEl = document.getElementById('score');
        const infoCenter = document.getElementById('info-center');
        const rightInfo = document.getElementById('right-info');
        
        // --- ★ 修正1: 全画面機能のバグ修正 ★ ---
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const gameContainer = document.getElementById('game-container');
        let isCSSFullscreen = false;

        function updateFullscreenUI(isFullscreen) {
            if (isFullscreen) {
                fullscreenBtn.innerText = "✖ 元に戻す";
            } else {
                fullscreenBtn.innerText = "🔲 全画面にする";
                gameContainer.classList.remove('ios-fullscreen');
                isCSSFullscreen = false;
            }
        }

        fullscreenBtn.addEventListener('click', () => {
            const isNativeFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
            if (isNativeFullscreen || isCSSFullscreen) {
                if (isNativeFullscreen) {
                    if (document.exitFullscreen) document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                } else {
                    updateFullscreenUI(false);
                }
            } else {
                if (gameContainer.requestFullscreen) {
                    gameContainer.requestFullscreen().catch(() => { gameContainer.classList.add('ios-fullscreen'); isCSSFullscreen = true; updateFullscreenUI(true); });
                } else if (gameContainer.webkitRequestFullscreen) { 
                    gameContainer.webkitRequestFullscreen(); 
                } else { 
                    gameContainer.classList.add('ios-fullscreen'); isCSSFullscreen = true; updateFullscreenUI(true); 
                }
            }
        });

        // Escキーなどで戻った時の検知を強化
        document.addEventListener('fullscreenchange', () => updateFullscreenUI(!!document.fullscreenElement));
        document.addEventListener('webkitfullscreenchange', () => updateFullscreenUI(!!document.webkitFullscreenElement));

        // --- ゲーム用変数 ---
        let gameState = 'loading'; // loading, select, calibration, playing, result
        let gameMode = ''; 
        let score = 0;
        let lives = 3;
        let timeLeft = 45;
        let gameTimer = null;
        let animationId = null;

        let ball = { x: 400, y: 400, vx: 0, vy: 0, radius: 10, speed: 6, maxSpeed: 18 };
        let blocks = [];
        const blockRows = 5, blockCols = 8;
        const blockWidth = 80, blockHeight = 25, blockPadding = 10, blockOffsetTop = 50, blockOffsetLeft = 45;

        // ★ 修正2・3: 描画消失バグを防ぐため、状態を保存するグローバル変数 ★
        let currentP1 = { x:0, y:0 };
        let currentP2 = { x:0, y:0 };
        let currentHandValid = false;
        let currentWarningMsg = "";
        let currentHandDist = 0.1;
        let isHandTracked = false;

        let handLine = { p1: {x:0, y:0}, p2: {x:0, y:0} };
        let lastHandCenter = { x:0, y:0 };
        let handVelocity = { vx:0, vy:0 };

        // 距離制限の数値を少しタイトにしてメリハリをつける
        const MIN_HAND_DIST = 0.08; 
        const MAX_HAND_DIST = 0.30; 
        const PLAY_AREA_LINE = canvasElement.height / 2; 

        function initBlocks() {
            blocks = [];
            for(let c=0; c<blockCols; c++) {
                for(let r=0; r<blockRows; r++) {
                    blocks.push({
                        x: (c*(blockWidth+blockPadding))+blockOffsetLeft,
                        y: (r*(blockHeight+blockPadding))+blockOffsetTop,
                        status: 1,
                        color: `hsl(${r * 40 + c * 20}, 80%, 60%)`
                    });
                }
            }
        }

        function resetBall() {
            ball.x = canvasElement.width / 2;
            ball.y = PLAY_AREA_LINE + 50;
            ball.vx = (Math.random() > 0.5 ? 1 : -1) * (ball.speed * 0.7);
            ball.vy = ball.speed; 
        }

        // --- 毎フレームの描画処理（ここでラケットも描画する） ---
        function gameLoop() {
            if (gameState !== 'playing') return;
            animationId = requestAnimationFrame(gameLoop);

            // 背景クリア（ここで一回真っ黒になる）
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.fillStyle = "#111";
            canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

            // ネット描画
            canvasCtx.beginPath();
            canvasCtx.moveTo(0, PLAY_AREA_LINE);
            canvasCtx.lineTo(canvasElement.width, PLAY_AREA_LINE);
            canvasCtx.strokeStyle = "rgba(255, 255, 255, 0.2)";
            canvasCtx.lineWidth = 4;
            canvasCtx.setLineDash([10, 10]);
            canvasCtx.stroke();
            canvasCtx.setLineDash([]);
            canvasCtx.fillStyle = "rgba(255, 255, 255, 0.3)";
            canvasCtx.font = "16px sans-serif";
            canvasCtx.fillText("⬇ これより下で打つ！ ⬇", canvasElement.width/2 - 90, PLAY_AREA_LINE + 20);

            // ブロック判定と描画
            let activeBlocks = 0;
            blocks.forEach(b => {
                if (b.status === 1) {
                    activeBlocks++;
                    canvasCtx.fillStyle = b.color;
                    canvasCtx.fillRect(b.x, b.y, blockWidth, blockHeight);
                    if (ball.x > b.x && ball.x < b.x + blockWidth && ball.y > b.y && ball.y < b.y + blockHeight) {
                        ball.vy = -ball.vy;
                        b.status = 0;
                        score += 100;
                        scoreEl.innerText = score;
                    }
                }
            });

            if (activeBlocks === 0 && gameMode === 'basic') { gameClear(); return; }

            // ボールの移動
            ball.x += ball.vx; ball.y += ball.vy;

            if (ball.x + ball.vx > canvasElement.width - ball.radius || ball.x + ball.vx < ball.radius) { ball.vx = -ball.vx; }
            if (ball.y + ball.vy < ball.radius) { ball.vy = -ball.vy; }

            if (currentHandValid) checkHandCollision();

            // 落下判定
            if (ball.y + ball.vy > canvasElement.height) {
                if (gameMode === 'basic') {
                    lives--; rightInfo.innerText = "残機: " + lives;
                    if (lives <= 0) { gameOver(); return; } else { resetBall(); }
                } else if (gameMode === 'timeattack') {
                    score -= 500; scoreEl.innerText = score;
                    currentWarningMsg = "落下ペナルティ: -500点";
                    setTimeout(() => { if(gameState === 'playing' && currentWarningMsg === "落下ペナルティ: -500点") currentWarningMsg = ""; }, 1000);
                    resetBall();
                }
            }

            // ★ 修正3: 背景やブロックを描いた後に、一番手前にラケットを描く ★
            if (isHandTracked) {
                canvasCtx.beginPath();
                canvasCtx.moveTo(currentP1.x, currentP1.y);
                canvasCtx.lineTo(currentP2.x, currentP2.y);
                canvasCtx.strokeStyle = currentHandValid ? "#00ffff" : "#ff0000";
                
                // ★ 修正2: 距離によって線の太さを変え、遠近感を強調する ★
                canvasCtx.lineWidth = Math.max(5, currentHandDist * 100); 
                canvasCtx.lineCap = "round";
                canvasCtx.stroke();
            }

            // ボール描画（一番手前）
            canvasCtx.beginPath();
            canvasCtx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            canvasCtx.fillStyle = "#fff";
            if (Math.abs(ball.vy) > ball.speed * 1.5) {
                canvasCtx.fillStyle = "#ff3b3b"; canvasCtx.shadowBlur = 10; canvasCtx.shadowColor = "red";
            } else { canvasCtx.shadowBlur = 0; }
            canvasCtx.fill();
            canvasCtx.shadowBlur = 0; 
            
            // テキスト更新
            if (currentWarningMsg !== "") {
                if (warningText.innerText !== currentWarningMsg) warningText.innerText = currentWarningMsg;
                warningText.style.display = 'block';
            } else {
                warningText.style.display = 'none';
            }
        }

        function checkHandCollision() {
            const A = handLine.p1; const B = handLine.p2; const P = ball;
            const ABx = B.x - A.x; const ABy = B.y - A.y;
            const APx = P.x - A.x; const APy = P.y - A.y;
            const lenAB2 = ABx * ABx + ABy * ABy;
            if (lenAB2 === 0) return; 

            let t = (APx * ABx + APy * ABy) / lenAB2;
            t = Math.max(0, Math.min(1, t)); 
            const Cx = A.x + t * ABx; const Cy = A.y + t * ABy;
            const dist = Math.hypot(P.x - Cx, P.y - Cy);

            if (dist < ball.radius + 15) { 
                let nx = P.x - Cx; let ny = P.y - Cy;
                const nLen = Math.hypot(nx, ny);
                if (nLen > 0) { nx /= nLen; ny /= nLen; }

                const dot = ball.vx * nx + ball.vy * ny;
                ball.vx = ball.vx - 2 * dot * nx;
                ball.vy = ball.vy - 2 * dot * ny;

                ball.vx += handVelocity.vx * 0.2;
                ball.vy += handVelocity.vy * 0.2;

                const currentSpeed = Math.hypot(ball.vx, ball.vy);
                if (currentSpeed < ball.speed) {
                    ball.vx = (ball.vx / currentSpeed) * ball.speed;
                    ball.vy = (ball.vy / currentSpeed) * ball.speed;
                } else if (currentSpeed > ball.maxSpeed) {
                    ball.vx = (ball.vx / currentSpeed) * ball.maxSpeed;
                    ball.vy = (ball.vy / currentSpeed) * ball.maxSpeed;
                }
                ball.x = Cx + nx * (ball.radius + 15);
                ball.y = Cy + ny * (ball.radius + 15);
            }
        }

        // --- AI認識と状態保存 ---
        function onResults(results) {
            // キャリブレーション時は自分の映像を描画する
            if (gameState === 'calibration') {
                canvasCtx.save();
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
                canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
                canvasCtx.restore();
            }

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                isHandTracked = true;
                const landmarks = results.multiHandLandmarks[0];
                const handDist = Math.hypot(landmarks[0].x - landmarks[9].x, landmarks[0].y - landmarks[9].y);
                currentHandDist = handDist; // 大きさ保存
                
                const p1 = { x: landmarks[5].x * canvasElement.width, y: landmarks[5].y * canvasElement.height };
                const p2 = { x: landmarks[8].x * canvasElement.width, y: landmarks[8].y * canvasElement.height };
                const center = { x: (p1.x + p2.x)/2, y: (p1.y + p2.y)/2 };
                currentP1 = p1; currentP2 = p2;

                handVelocity.vx = center.x - lastHandCenter.x; handVelocity.vy = center.y - lastHandCenter.y;
                lastHandCenter = { x: center.x, y: center.y };
                handLine = { p1: p1, p2: p2 };
                
                if (gameState === 'calibration') {
                    if (handDist > MAX_HAND_DIST) {
                        overlayDesc.innerHTML = "人差し指を立てて、画面に向けてください。<br><br><span style='color:#ff3b3b; font-size:1.5rem; background:rgba(0,0,0,0.5); padding:10px;'>❌ 近すぎます！もう少し離れてください</span>";
                        actionBtn.style.display = 'none';
                    } else if (handDist < MIN_HAND_DIST) {
                        overlayDesc.innerHTML = "人差し指を立てて、画面に向けてください。<br><br><span style='color:#ff3b3b; font-size:1.5rem; background:rgba(0,0,0,0.5); padding:10px;'>❌ 遠すぎます！もう少し近づいてください</span>";
                        actionBtn.style.display = 'none';
                    } else {
                        overlayDesc.innerHTML = "人差し指を立てて、画面に向けてください。<br><br><span style='color:#4CAF50; font-size:1.5rem; background:rgba(0,0,0,0.5); padding:10px;'>🟢 OK！バッチリです。<br>この距離感で水色の線を使って打ち返します。</span>";
                        actionBtn.style.display = 'block'; actionBtn.disabled = false;
                        
                        canvasCtx.save();
                        canvasCtx.beginPath();
                        canvasCtx.moveTo(p1.x, p1.y); canvasCtx.lineTo(p2.x, p2.y);
                        canvasCtx.strokeStyle = "#00ffff"; 
                        canvasCtx.lineWidth = Math.max(5, handDist * 100); 
                        canvasCtx.lineCap = "round"; canvasCtx.stroke();
                        canvasCtx.restore();
                    }
                } 
                else if (gameState === 'playing') {
                    if (handDist > MAX_HAND_DIST) { currentHandValid = false; currentWarningMsg = "近すぎます！もう少し離れてください"; } 
                    else if (handDist < MIN_HAND_DIST) { currentHandValid = false; currentWarningMsg = "遠すぎます！もう少し近づいてください"; } 
                    else if (center.y < PLAY_AREA_LINE) { currentHandValid = false; currentWarningMsg = "ラインより下で打ち返してください！"; }
                    else { currentHandValid = true; currentWarningMsg = ""; }
                }
            } else {
                isHandTracked = false;
                currentHandValid = false;
                handVelocity = { vx:0, vy:0 };
                if (gameState === 'calibration') {
                    overlayDesc.innerHTML = "人差し指を立てて、画面に向けてください。<br><br><span style='color:#ffff00; font-size:1.5rem; background:rgba(0,0,0,0.5); padding:10px;'>手が認識されていません</span>";
                    actionBtn.style.display = 'none';
                } else if (gameState === 'playing' && currentWarningMsg !== "落下ペナルティ: -500点") {
                    currentWarningMsg = "手が認識されていません";
                }
            }
        }

        // --- 画面フロー管理 ---
        function showModeSelection() {
            gameState = 'select';
            overlayScreen.style.display = 'flex';
            overlayScreen.style.background = 'rgba(0,0,0,0.85)';
            overlayTitle.innerText = "モードを選択してください";
            overlayDesc.style.display = 'none'; modeSelection.style.display = 'flex';
            retryBtn.style.display = 'none'; actionBtn.style.display = 'none';
            uiLayer.style.display = 'none'; warningText.style.display = 'none';
            if (animationId) cancelAnimationFrame(animationId);
            clearInterval(gameTimer);
        }

        function startCalibration(mode) {
            gameMode = mode; gameState = 'calibration';
            overlayScreen.style.background = 'rgba(0,0,0,0.4)';
            overlayTitle.innerText = "距離の調整・準備";
            overlayDesc.innerHTML = "人差し指を立てて、画面に向けてください。<br>手を認識しています...";
            overlayDesc.style.display = 'block'; modeSelection.style.display = 'none';
            actionBtn.innerText = "この距離でゲームスタート"; actionBtn.style.display = 'none'; 
        }

        actionBtn.addEventListener('click', () => { if (gameState === 'calibration') startPlaying(); });

        function startPlaying() {
            gameState = 'playing';
            overlayScreen.style.display = 'none'; uiLayer.style.display = 'flex';
            score = 0; scoreEl.innerText = score; warningText.style.display = 'none';
            initBlocks(); resetBall();

            if (gameMode === 'basic') {
                lives = 3; timeLeft = 0; 
                rightInfo.innerText = "残機: " + lives; infoCenter.innerText = "ベーシック";
                gameTimer = setInterval(() => { timeLeft++; }, 1000);
            } else {
                timeLeft = 45; 
                rightInfo.innerText = "Time: " + timeLeft + "s"; infoCenter.innerText = "タイムアタック";
                gameTimer = setInterval(() => {
                    timeLeft--; rightInfo.innerText = "Time: " + timeLeft + "s";
                    if (timeLeft <= 0) gameOver(); 
                }, 1000);
            }
            animationId = requestAnimationFrame(gameLoop);
        }

        function gameClear() {
            gameState = 'result'; clearInterval(gameTimer);
            let timeBonus = Math.max(0, (120 - timeLeft) * 10); score += timeBonus;
            overlayScreen.style.display = 'flex'; overlayScreen.style.background = 'rgba(0,0,0,0.85)';
            overlayTitle.innerText = "🎉 GAME CLEAR! 🎉";
            overlayDesc.innerHTML = `全ブロック破壊！<br>タイムボーナス: +${timeBonus}<br><br>最終スコア: ${score}点`;
            overlayDesc.style.display = 'block'; modeSelection.style.display = 'none'; retryBtn.style.display = 'block';
        }

        function gameOver() {
            gameState = 'result'; clearInterval(gameTimer);
            overlayScreen.style.display = 'flex'; overlayScreen.style.background = 'rgba(0,0,0,0.85)';
            if (gameMode === 'basic') { overlayTitle.innerText = "GAME OVER"; overlayDesc.innerHTML = `無念...残機がなくなりました。<br>スコア: ${score}点`; } 
            else { overlayTitle.innerText = "タイムアップ！"; overlayDesc.innerHTML = `45秒間よく頑張りました！<br>最終スコア: ${score}点`; }
            overlayDesc.style.display = 'block'; modeSelection.style.display = 'none'; retryBtn.style.display = 'block';
        }

        const hands = new Hands({locateFile: (file) => { return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`; }});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        hands.onResults(onResults);

        const camera = new Camera(videoElement, { onFrame: async () => { await hands.send({image: videoElement}); }, width: 800, height: 600 });
        camera.start().then(() => { showModeSelection(); }).catch(err => { alert("カメラの起動に失敗しました。権限を確認してください。"); });
    </script>
</body>
</html>
