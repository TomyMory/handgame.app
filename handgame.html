<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Crush AR</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #333;
            color: white;
            font-family: sans-serif;
            text-align: center;
        }
        #game-container {
            position: relative;
            width: 640px;
            height: 480px;
            margin: 20px auto;
            border: 4px solid #fff;
            border-radius: 10px;
            background-color: #000;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 6px;
        }
        /* ビデオとキャンバスは左右反転させて鏡のようにする */
        video, #game-canvas {
            transform: scaleX(-1);
        }
        #ui-layer {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 24px;
            font-weight: bold;
            z-index: 10;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
        button {
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>🍎 Apple Crush AR 🍎</h1>
    <p>手のひらの黄緑色シールをカメラに見せて移動し、握って（隠して）リンゴを潰そう！</p>

    <div id="game-container">
        <!-- 自動再生ブロック対策のため muted を追加 -->
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="game-canvas" width="640" height="480"></canvas>
        
        <div id="ui-layer">
            <div>Score: <span id="score">0</span></div>
            <div>Time: <span id="time">30</span>s</div>
        </div>

        <div id="start-screen">
            <h2>準備ができたらスタート</h2>
            <button id="start-btn">ゲームスタート</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');

        let isPlaying = false;
        let score = 0;
        let timeLeft = 30;
        let apples = [];
        let handPos = { x: 320, y: 240 };
        let isHandOpen = false; // シールが見えているか

        // --- カメラの設定 ---
        async function setupCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480, facingMode: "user" }
                });
                video.srcObject = stream;
                
                // 映像データが読み込まれたら明示的に再生する
                video.onloadedmetadata = () => {
                    video.play();
                };
            } catch (err) {
                alert("カメラのアクセスが許可されていません。");
                console.error(err);
            }
        }

        // --- 色認識処理 (黄緑色) ---
        function trackColor() {
            // ビデオ映像をキャンバスに描画
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = frame.data;
            
            let matchCount = 0;
            let sumX = 0, sumY = 0;

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];

                // 黄緑色の判定基準
                if (g > 150 && r > 100 && r < 200 && b < 100) {
                    matchCount++;
                    const pixelIndex = i / 4;
                    sumX += pixelIndex % canvas.width;
                    sumY += Math.floor(pixelIndex / canvas.width);
                }
            }

            const previousState = isHandOpen;
            
            // ピクセル数が一定以上なら「手を開いている（シールが見える）」と判定
            if (matchCount > 50) {
                isHandOpen = true;
                handPos.x = sumX / matchCount;
                handPos.y = sumY / matchCount;
            } else {
                isHandOpen = false;
            }

            // 「開いていた」状態から「閉じた（シールが隠れた）」状態への変化を検知
            if (previousState === true && isHandOpen === false && isPlaying) {
                crushAction();
            }
        }

        // --- ゲームのアクション ---
        function crushAction() {
            // 手を握った位置（最後に追跡した手の位置）で当たり判定
            apples.forEach(apple => {
                if (apple.state === 'falling') {
                    const dist = Math.hypot(apple.x - handPos.x, apple.y - handPos.y);
                    if (dist < 60) { // 当たり判定の範囲
                        apple.state = 'crushed';
                        score++;
                        scoreEl.innerText = score;
                    }
                }
            });
        }

        // --- リンゴの管理 ---
        function spawnApple() {
            if (!isPlaying) return;
            apples.push({
                x: Math.random() * (canvas.width - 60) + 30, // ランダムなX座標
                y: -30,
                speed: Math.random() * 2 + 2, // 落下速度
                state: 'falling'
            });
            // 次のリンゴをランダムな時間で生成
            setTimeout(spawnApple, Math.random() * 1000 + 500);
        }

        // --- 描画処理 ---
        function drawGame() {
            trackColor();

            // ターゲット（手）の描画
            ctx.beginPath();
            ctx.arc(handPos.x, handPos.y, 30, 0, Math.PI * 2);
            ctx.strokeStyle = isHandOpen ? "lime" : "red";
            ctx.lineWidth = 3;
            ctx.stroke();

            // リンゴの更新と描画
            for (let i = apples.length - 1; i >= 0; i--) {
                let p = apples[i];
                if (p.state === 'falling') {
                    p.y += p.speed;
                    ctx.font = "40px sans-serif";
                    ctx.fillText("🍎", p.x - 20, p.y + 15);
                    
                    // 画面外に出たら削除
                    if (p.y > canvas.height + 30) apples.splice(i, 1);
                } else if (p.state === 'crushed') {
                    ctx.font = "40px sans-serif";
                    ctx.fillText("💥", p.x - 20, p.y + 15);
                    p.y += p.speed * 0.5; // 潰れた後少しゆっくり落ちる
                    p.alpha = (p.alpha || 1) - 0.05; // フェードアウト用
                    if (p.alpha <= 0) apples.splice(i, 1);
                }
            }

            if (isPlaying) {
                requestAnimationFrame(drawGame);
            }
        }

        // --- タイマー処理 ---
        function startGame() {
            score = 0;
            timeLeft = 30;
            apples = [];
            scoreEl.innerText = score;
            timeEl.innerText = timeLeft;
            startScreen.style.display = 'none';
            isPlaying = true;

            spawnApple();
            drawGame();

            const timer = setInterval(() => {
                timeLeft--;
                timeEl.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    isPlaying = false;
                    setTimeout(() => {
                        alert(`タイムアップ！ スコア: ${score}個`);
                        startScreen.style.display = 'flex';
                    }, 100);
                }
            }, 1000);
        }

        // 初期化
        setupCamera();
        startBtn.addEventListener('click', startGame);

    </script>
</body>
</html>
